# OSINT Agent Configuration

target:
  domain: ""  # Set via CLI or prompt
  scope:
    - ""  # allowed domains/patterns
  authorization: "confirmed"  # pending | confirmed | denied
  mode: "deep"  # passive | active | deep

paths:
  output_dir: "reports"
  wordlists: "wordlists"
  state_dir: "reports/{target}/state"

hibp_api_key: ""  # Set via env HIBP_API_KEY or here
shodan_api_key: ""  # Set via env SHODAN_API_KEY
urlscan_api_key: ""  # Set via env URLSCAN_API_KEY

api_keys:
  virustotal: ""       # VIRUSTOTAL_API_KEY or VT_API_KEY
  greynoise: ""        # GREYNOISE_API_KEY
  abuseipdb: ""        # ABUSEIPDB_API_KEY
  chaos: ""            # CHAOS_API_KEY or PDCP_API_KEY
  hunter_io: ""        # HUNTER_API_KEY or HUNTER_IO_API_KEY
  securitytrails: ""   # SECURITYTRAILS_API_KEY
  vulners: ""          # VULNERS_API_KEY
  urlscan: ""          # URLSCAN_API_KEY
  hibp: ""             # HIBP_API_KEY
  shodan: ""           # SHODAN_API_KEY

auth:
  # Optional authenticated testing context. These values are applied to HTTP
  # wrapper requests and browser-rendered crawl pages.
  headers: ""
  cookies: ""
  cookie: ""
  bearer_token: ""
  probe_backoff_seconds: 10

llm:
  model: ""            # e.g. "deepseek" (deepseek/deepseek-chat), "openai", or a full "provider/model"
  api_key: ""
  temperature: 0.1
  max_tokens: 2000

rate_limits:
  default:
    concurrent: 5
    per_minute: 60
  dns:
    concurrent: 10
    per_minute: 120
  http:
    concurrent: 5
    per_minute: 60
  scan:
    concurrent: 1
    per_minute: 10

detectability:
  default: "high"  # low | medium | high
  allow_high: true  # requires explicit auth

# Per-engagement resource caps for the pentest-agent pipeline (dry-run plans
# and engaged runs both enforce these).
budget_limits:
  max_requests: 5000
  max_wall_clock_seconds: 1800
  max_llm_calls: 100
  max_concurrent_actions: 2

waf:
  max_bypass_attempts: 10
  backoff_seconds: 60
  block_codes: [503, 429]
  honeypot_codes: [500]

modules:
  auto_run: true
  skip_on_waf: true
  max_consecutive_empty: 5  # stop module after N empty probes
  record_http_evidence: true

misconfig:
  concurrency: 12
  timeout: 5
  max_paths: 160
  max_consecutive_empty: 60
  progress_every: 25

fast_scan:
  # Lightweight replacement for heavyweight consolidated scanners.
  # Focuses on high-signal headers, CORS, and sensitive path exposure.
  timeout: 4
  concurrency: 8
  max_paths: 20
  paths:
    - "/.env"
    - "/.git/config"
    - "/.git/HEAD"
    - "/wp-config.php"
    - "/wp-content/debug.log"
    - "/phpinfo.php"
    - "/info.php"
    - "/server-status"
    - "/actuator/env"
    - "/actuator/heapdump"
    - "/swagger.json"
    - "/swagger/v1/swagger.json"
    - "/v2/api-docs"
    - "/v3/api-docs"
    - "/graphql"
    - "/graphiql"
    - "/api/graphql"
    - "/phpmyadmin/"
    - "/adminer.php"
    - "/backup.sql"

nuclei:
  full_cve_on_confirmed_apex: true

oob:
  # Configure real callback infrastructure for blind SSRF/XXE/SQLi/RCE checks.
  # callback_domain example: "oob.your-bounty-box.example"
  # server_url/poll_url can point at an interactsh-compatible HTTP wrapper.
  callback_domain: ""
  server_url: ""
  poll_url: ""
  token: ""
  poll_interval: 2
  poll_timeout: 30

xss:
  max_points: 80
  browser_confirm: true
  dalfox_timeout: 600

scoring:
  weights:
    cvss: 0.4
    epss: 0.3
    kev: 0.2
    exposure: 0.1

