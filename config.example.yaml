# OSINT Agent Configuration

# External tool backend: where scanner binaries run.
#   local (default) — use binaries installed on this machine.
#   docker — run every baked binary inside the toolchain image instead.
#     Teammates then need only Python and Docker: no nmap/nuclei/sqlmap/
#     wpscan installs. The repo root mounts at /work in the container,
#     so tool outputs land back in reports/ like a local run.
#     Build once: docker build -f docker/Dockerfile.tools -t osint-tools:latest .
# Env overrides (win over this file): OSINT_TOOLS_BACKEND, OSINT_TOOLS_IMAGE.
tools:
  backend: "local"            # local | docker
  image: "osint-tools:latest"

target:
  domain: ""  # Set via CLI or prompt
  mode: "deep"  # passive | active | deep

paths:
  output_dir: "reports"
  wordlists: "wordlists"
  state_dir: "reports/{target}/state"

hibp_api_key: ""  # Set via env HIBP_API_KEY or here
shodan_api_key: ""  # Set via env SHODAN_API_KEY
urlscan_api_key: ""  # Set via env URLSCAN_API_KEY

api_keys:
  virustotal: ""       # VIRUSTOTAL_API_KEY or VT_API_KEY
  greynoise: ""        # GREYNOISE_API_KEY
  abuseipdb: ""        # ABUSEIPDB_API_KEY
  chaos: ""            # CHAOS_API_KEY or PDCP_API_KEY
  hunter_io: ""        # HUNTER_API_KEY or HUNTER_IO_API_KEY
  securitytrails: ""   # SECURITYTRAILS_API_KEY
  vulners: ""          # VULNERS_API_KEY
  urlscan: ""          # URLSCAN_API_KEY
  hibp: ""             # HIBP_API_KEY
  shodan: ""           # SHODAN_API_KEY

auth:
  # Optional authenticated testing context. These values are applied to HTTP
  # wrapper requests and browser-rendered crawl pages.
  headers: ""
  cookies: ""
  cookie: ""
  bearer_token: ""
  probe_backoff_seconds: 10

  # ── Multi-identity sessions (required by the idor_differ module) ──
  #
  # IDOR testing compares what two different accounts can see, so supply two
  # accounts you own. Each identity gets its own cookie jar inside the shared
  # connection pool, so the two sessions cannot contaminate each other.
  #
  # Three ways to authenticate an identity, in order of preference:
  #
  #   1. Static session (simplest — log in by hand, copy the cookie):
  #        user_a:
  #          cookies: {session: "abc123"}
  #          verify_url: "https://target/dashboard"
  #          success_marker: "Sign out"      # must appear when logged in
  #
  #   2. Scripted login (harness submits the form and adopts the cookie):
  #        user_b:
  #          verify_url: "https://target/dashboard"
  #          success_marker: "Sign out"
  #          login:
  #            url: "https://target/login"
  #            method: POST
  #            data: {user: me@example.com, pass: "..."}
  #
  #      The login page is fetched first and its hidden fields are merged in,
  #      so CSRF and authenticity tokens are handled without configuration.
  #      Set `csrf: false` for a form that has none, or `content_type: json`
  #      for a JSON API (data is then serialised and not CSRF-patched).
  #
  #   3. Bearer token:
  #        user_c:
  #          bearer_token: "eyJhbGci..."
  #          verify_url: "https://target/api/me"
  #
  #   4. HTTP Basic:
  #        user_d:
  #          basic_auth: {user: "api-user", password: "..."}
  #          verify_url: "https://target/api/me"
  #
  # `success_marker` sits on the identity, not inside `login`, and matters more
  # than it looks: a failed login usually returns HTTP 200 with the login form
  # again, so without a marker the harness cannot tell a real session from a
  # bounce and will report confident nonsense.
  identities: {}
  #   user_a:
  #     cookies: {session: "..."}
  #     verify_url: "https://target/dashboard"
  #     success_marker: "Sign out"
  #   user_b:
  #     cookies: {session: "..."}
  #     verify_url: "https://target/dashboard"
  #     success_marker: "Sign out"

llm:
  model: ""            # e.g. "deepseek" (deepseek/deepseek-chat), "openai", or a full "provider/model"
  api_key: ""
  temperature: 0.1
  max_tokens: 2000

# Wall-clock ceiling for a single module, in seconds. A module that exceeds it
# is recorded as `timeout` and the run continues. Without this the slowest
# module decides how long the pipeline takes: `open_redirect` once ran for
# seven minutes in silence before the modules queued behind it were reached.
# 0 or absent falls back to 300.
module_timeout: 300

rate_limits:
  default:
    concurrent: 5
    per_minute: 60
  dns:
    concurrent: 10
    per_minute: 120
  http:
    concurrent: 5
    per_minute: 60
  scan:
    concurrent: 1
    per_minute: 10

detectability:
  default: "high"  # low | medium | high

# Per-engagement resource caps for the pentest-agent pipeline. Set any value
# to 0 to disable that cap.
budget_limits:
  max_requests: 0              # 0 = unlimited
  max_wall_clock_seconds: 0    # 0 = unlimited
  max_llm_calls: 0             # 0 = unlimited
  max_concurrent_actions: 5    # throughput knob, not a cap

# Response codes recorded as WAF/honeypot signals on the state store. Purely
# observational — nothing is blocked or skipped based on these.
waf:
  block_codes: [503, 429]
  honeypot_codes: [500]

modules:
  auto_run: true
  max_consecutive_empty: 5  # stop module after N empty probes
  record_http_evidence: true
  idor:
    # Explicit object endpoints for the idor_differ module. Normally derived
    # from js_analysis output; list them here when the API shape is already
    # known, otherwise the module falls back to its built-in path seeds.
    endpoints: []
    # Ceiling on cross-account probes per endpoint template.
    max_probes_per_template: 15

    # Ownership for object shapes that have no listing endpoint — a basket,
    # a cart, an order fetched by id. Ownership normally comes from comparing
    # two accounts' views of a collection, so an endpoint nobody lists never
    # enters the map: both accounts appear to hold every reference, the
    # difference that proves privacy is empty, and the module reports zero
    # probes against an endpoint anyone can read. When enabled, references
    # the target has already disclosed are fetched once against those shapes
    # and kept only when the response's own owner field names one of your
    # accounts, so a record belonging to nobody you hold credentials for is
    # read and discarded rather than claimed.
    object_probe:
      enabled: true
      max_refs: 12             # references tried per endpoint
      max_fetches: 24          # per endpoint, every identity included
      max_total_fetches: 240   # across the whole run
      stop_after_misses: 6     # consecutive ids nobody has, then move on

    # Ceiling on collection endpoints fetched while mapping who owns what.
    max_collections: 60

    # Collection endpoints to enumerate directly. When neither `endpoints` nor
    # a discovered object URL exists, the module synthesises object templates
    # from these — that is the case where recon only ever found a list route.
    collection_paths: []
    #   - "/api/v1/invoices"

    # Probe a built-in resource wordlist for collection endpoints. This is
    # what finds objects the crawler never saw. Costs one request per
    # (prefix x resource), so lower `max_collections` if the target is slow.
    probe_collections: true
    # Resources to try when the wordlist above is not enough. Defaults to a
    # built-in list of per-user resources.
    resources: []
    # api_prefixes: ["/api", "/api/v1", "/v1"]

    # Page that identifies the *requesting* account, used to attribute a leak
    # to a third party. Defaults to each identity's own verify_url.
    account_endpoint: ""

    # Objects readable with no session at all. Off by default because it
    # widens the test surface beyond the accounts you supplied.
    test_anonymous: false

    # Cross-account write authorisation. Reading another account's invoice is
    # bad; overwriting it is worse, and many apps check GET but not the
    # mutating verbs. PATCH/PUT echo the record's current values back, so a
    # confirmed bug still leaves the data intact.
    test_write_methods: []
    #   - PATCH
    #   - PUT
    # DELETE cannot be made safe and is never sent without this flag.
    allow_destructive: false

    # Sequential identifier probing for records belonging to accounts you do
    # not control — the case two test accounts can never prove. Reaches other
    # people's data, so it is opt-in and bounded.
    id_probing:
      enabled: false
      radius: 3    # how far from each known reference to try
      max: 20      # hard ceiling on requests

  mass_assignment:
    # Writes to the configured account, so it is off unless you turn it on.
    # It only ever writes to the caller's own object, never anyone else's.
    enabled: false

    # Where to look for the caller's own record. Left empty it tries the
    # usual /api/me, /api/profile, ... shapes. Set it when recon already found
    # the object URL — that URL is also used as the write target.
    endpoints: []
    #   - "https://api.example.com/users/me"

    # Optional: a different URL for the update, e.g. when the read endpoint is
    # read-only. Accepts a full URL or a path.
    # write_endpoint: "https://api.example.com/users/me"

    method: PATCH      # PATCH, PUT or POST

    # Fields to try. Defaults to a list of privilege-bearing names (role,
    # is_admin, credits, ...). Anything the account can already see is skipped.
    fields: []
    #   - "role"
    #   - "is_admin"

    # Value sent for each field, and the value written back afterwards. An API
    # that binds arbitrary fields is almost always doing a partial update, so
    # the reset has to name the field — omitting it would leave the probe in.
    probe_type: bool   # bool | int | string

  prototype_pollution:
    # Sends a canary property through a JSON body and checks whether it turned
    # up on Object.prototype. Left on: a handful of POSTs, no data harmed, and
    # the canary is inert and unique per run. The pollution itself does persist
    # until the process restarts.
    enabled: true

    # Endpoints that accept a JSON body. Set these from recon when you know
    # them; otherwise the usual profile/account/update shapes are tried.
    endpoints: []
    #   - "https://api.example.com/api/profile"

    # Where to look for proof. It must return a freshly built object, and it
    # must list inherited properties — an endpoint that returns a bare {}
    # proves nothing, because JSON.stringify only walks own properties and
    # would hide a polluted prototype. Point this at a Node/Express app you
    # control while testing. Defaults to the first endpoint above.
    # reflect_endpoint: "https://api.example.com/api/reflect"

    methods: [POST, PUT]

    # The two shapes that reach a prototype. Trim to one if you want the
    # smallest possible footprint.
    payloads:
      - "__proto__"
      - "constructor.prototype"

  http_smuggling:
    enabled: true

    # Hosts to hand to smuggler. Left empty, URLs from recon are used.
    # Results land as TENTATIVE, never as confirmed findings: smuggling needs a
    # front end and a back end that disagree on request boundaries, which no
    # single-host check can show.
    max_targets: 10

  open_redirect:
    enabled: true

    # Parameter names to try. Left empty, the common redirect names plus any
    # redirect-like name recon already recorded.
    params: []
    #   - "next"
    #   - "returnUrl"

    # Endpoints to test. Left empty, URLs from recon are used, then a short
    # list of shapes that usually redirect (sign-in flows included).
    endpoints: []

    # (endpoint, parameter) pairs to try. Each pair may send several payload
    # shapes, so this is the real bound on request volume.
    max_targets: 40

  cms_deep_scan:
    enabled: true

    # How many webapps to hand to the CMS scanners. These are slow (WPScan and
    # droopescan run to five minutes each), so the bound matters.
    max_targets: 5

    # Results are graded per component, not merged into one count. A disclosed
    # version lands as INFO; a known CVE lands as HIGH, or CRITICAL when CISA
    # lists it as exploited; a keyword-matched line that names no component is
    # LOW/TENTATIVE, because a scanner mentioning "/administrator/" is not a
    # finding. Confirm a version match against the running build before
    # treating any of it as confirmed.

  content_discovery:
    enabled: true

    # API-route brute force via kiterunner (assetnote wordlists, downloaded
    # at scan time — nothing baked into the image). Hits reuse the same
    # grading as ffuf: a 200 on a sensitive name is MEDIUM, a 401/403 is
    # INFO, anything else is an asset. Bounded per target so a big API
    # does not eat the module timeout.
    kiterunner:
      enabled: true
      wordlist: "apiroutes-260227"  # see `kr wordlist list` for current names
      max_routes: 1500               # routes tried per target (cap 20000)
      max_targets: 2                 # base URL + api_endpoint origins (cap 10)
      # Polite knobs for live scopes (delay 1000 + connections 1 ≈ 1 req/s);
      # the defaults below are a lab setting.
      delay_ms: 100
      connections: 3                 # parallel connections per host (cap 10)

    # Results are graded by what the status establishes. A 200 on a
    # sensitive-looking path is MEDIUM; a 401/403 is INFO, because access
    # control holding is not a weakness. ffuf runs with -ac, and hits sharing a
    # dominant response shape are dropped as catch-all, so a SPA answering 200
    # for everything does not report the whole wordlist.

  cors_audit:
    enabled: true

    # Endpoints to send the probe Origin at. Left empty, the endpoints
    # recon already recorded are used, then a short list of common shapes.
    endpoints: []
    max_endpoints: 20

  sqli_scan:
    # Hand sqlmap an interactsh server so blind injections get proof instead of
    # a "the response looked the same either way" FIRM. Requires the top-level
    # `oob.server_url` above — a callback domain alone is not enough, because
    # sqlmap needs somewhere to poll. Findings are only promoted to CONFIRMED
    # for the exact URL that produced a callback.
    oast: true

  ssrf_scan:
    # Generic server-side request forgery: URL-bearing parameters get a
    # path-tagged OOB callback each. An HTTP callback is HIGH/CONFIRMED;
    # DNS-only is MEDIUM/FIRM (egress without proving a full fetch);
    # a fetch error naming our domain is MEDIUM/FIRM (attempted);
    # silence files one aggregate LOW. Without an OOB channel nothing is
    # probed — candidates file as one aggregate LOW instead.
    # The target is only ever asked to fetch OUR callback URL: cloud
    # metadata addresses are never requested, so instance credentials
    # cannot land in evidence on a hit.
    enabled: true
    max_points: 6                # URL parameters probed per run (cap 30)
    # params: ["url", "src"]     # override the built-in URL-param names

  auth_audit:
    # Lab packs (knowledge/*.yaml) inject extra paths and credentials here
    # for known targets. Module defaults stay generic; target knowledge
    # lives in config, not code.
    # extra_login_paths: ["/rest/user/login"]
    # extra_admin_paths: ["/rest/admin/application-configuration"]
    # extra_credentials: [["admin@juice-sh.op", "admin123"]]
    # Set true only to prove missing-current-password flaws by writing.
    test_password_change: false

  business_logic:
    # Own-account logic flaws in two halves. The surface half is
    # read-only and always on: it reports which privilege-bearing
    # fields exist on the caller's own record (INFO recon for the
    # mass_assignment write test). The tamper half replays hostile
    # quantity/price/discount values at the caller's own cart and
    # compares totals — proof is differential, and every probe is
    # restored and the restore verified. Needs a verified identity;
    # no checkout is ever completed.
    enabled: true
    max_probes: 12               # hostile values sent per run (cap 40)
    # endpoints: ["/api/cart"]   # discovered api_endpoints win when present

misconfig:
  concurrency: 12
  timeout: 5
  max_paths: 160
  max_consecutive_empty: 60
  progress_every: 25
  # Target-specific backup basenames (lab packs merge theirs here).
  # Module defaults stay generic; knowledge lives in config, not code.
  extra_backup_bases: []

fast_scan:
  # Lightweight replacement for heavyweight consolidated scanners.
  # Focuses on high-signal headers, CORS, and sensitive path exposure.
  timeout: 4
  concurrency: 8
  max_paths: 20
  paths:
    - "/.env"
    - "/.git/config"
    - "/.git/HEAD"
    - "/wp-config.php"
    - "/wp-content/debug.log"
    - "/phpinfo.php"
    - "/info.php"
    - "/server-status"
    - "/actuator/env"
    - "/actuator/heapdump"
    - "/swagger.json"
    - "/swagger/v1/swagger.json"
    - "/v2/api-docs"
    - "/v3/api-docs"
    - "/graphql"
    - "/graphiql"
    - "/api/graphql"
    - "/phpmyadmin/"
    - "/adminer.php"
    - "/backup.sql"

nuclei:
  full_cve_on_confirmed_apex: true
  # Templates freeze at image build: the module logs their age into
  # evidence and warns past max_age_days (a stale set misses CVEs, it
  # never invents them). update_templates refreshes first — opt-in
  # because it downloads hundreds of MB from GitHub mid-engagement.
  max_age_days: 30
  update_templates: false

oob:
  # Configure real callback infrastructure for blind SSRF/XXE/SQLi/RCE checks.
  # Two modes, both optional (empty = OOB checks stay dormant):
  #
  # public — multiplexed session against the interactsh network. No
  #   server of your own: needs only the interactsh-client binary
  #   (baked into the docker image). Free and throttled; fine for
  #   own-asset work, not for stealth.
  #   mode: public
  #
  # wrapper — your own interactsh-compatible HTTP shim (self-hosted
  #   server or a custom poll API). Needs a domain + wildcard DNS.
  #   callback_domain example: "oob.your-bounty-box.example"
  # server_url/poll_url can point at an interactsh-compatible HTTP wrapper.
  mode: ""
  callback_domain: ""
  server_url: ""
  poll_url: ""
  token: ""
  poll_interval: 2
  poll_timeout: 30
  # `enabled: false` turns off OOB everywhere without deleting the settings.
  enabled: true

xss:
  max_points: 80
  browser_confirm: true
  dalfox_timeout: 600
  # Let dalfox run its own interactsh session against the public mesh.
  # Findings from that session stay FIRM (dalfox saw the callback, the
  # framework did not poll it). Off by default: the framework-owned blind
  # pass above confirms via poll and can reach CONFIRMED.
  dalfox_blind_oob: false
  # Global outbound cap for dalfox in requests/second (0 = unlimited).
  dalfox_rate_limit: 0

semgrep:
  # SAST over downloaded JS bundles with repo-local rules (rules/semgrep/).
  # Offline and deterministic: no registry, no metrics. Taint flows file as
  # MEDIUM/TENTATIVE, plain sinks as LOW — static either way, never proof.
  enabled: true
  rules: "rules/semgrep"

crawl:
  browser:
    # Rendered crawling: one context per verified identity (static
    # sessions, scripted logins, or sessions captured mid-run) plus the
    # anonymous baseline. Only verified sessions render as authenticated;
    # an expired cookie is never mislabelled. Same-origin links are
    # followed to `depth` with a per-context page cap; cross-origin
    # links are recorded, never rendered.
    enabled: true
    max_targets: 8               # pages rendered per context (cap 50)
    depth: 1                     # link-following depth, same-origin only (cap 3)
    max_identities: 2            # verified identities rendered (cap 5)
    wait_ms: 1500

scoring:
  weights:
    cvss: 0.4
    epss: 0.3
    kev: 0.2
    exposure: 0.1

