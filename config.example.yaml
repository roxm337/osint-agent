# OSINT Agent Configuration

target:
  domain: ""  # Set via CLI or prompt
  mode: "deep"  # passive | active | deep

paths:
  output_dir: "reports"
  wordlists: "wordlists"
  state_dir: "reports/{target}/state"

hibp_api_key: ""  # Set via env HIBP_API_KEY or here
shodan_api_key: ""  # Set via env SHODAN_API_KEY
urlscan_api_key: ""  # Set via env URLSCAN_API_KEY

api_keys:
  virustotal: ""       # VIRUSTOTAL_API_KEY or VT_API_KEY
  greynoise: ""        # GREYNOISE_API_KEY
  abuseipdb: ""        # ABUSEIPDB_API_KEY
  chaos: ""            # CHAOS_API_KEY or PDCP_API_KEY
  hunter_io: ""        # HUNTER_API_KEY or HUNTER_IO_API_KEY
  securitytrails: ""   # SECURITYTRAILS_API_KEY
  vulners: ""          # VULNERS_API_KEY
  urlscan: ""          # URLSCAN_API_KEY
  hibp: ""             # HIBP_API_KEY
  shodan: ""           # SHODAN_API_KEY

auth:
  # Optional authenticated testing context. These values are applied to HTTP
  # wrapper requests and browser-rendered crawl pages.
  headers: ""
  cookies: ""
  cookie: ""
  bearer_token: ""
  probe_backoff_seconds: 10

  # ── Multi-identity sessions (required by the idor_differ module) ──
  #
  # IDOR testing compares what two different accounts can see, so supply two
  # accounts you own. Each identity gets its own cookie jar inside the shared
  # connection pool, so the two sessions cannot contaminate each other.
  #
  # Three ways to authenticate an identity, in order of preference:
  #
  #   1. Static session (simplest — log in by hand, copy the cookie):
  #        user_a:
  #          cookies: {session: "abc123"}
  #          verify_url: "https://target/dashboard"
  #          success_marker: "Sign out"      # must appear when logged in
  #
  #   2. Scripted login (harness submits the form and adopts the cookie):
  #        user_b:
  #          verify_url: "https://target/dashboard"
  #          success_marker: "Sign out"
  #          login:
  #            url: "https://target/login"
  #            method: POST
  #            data: {user: me@example.com, pass: "..."}
  #
  #      The login page is fetched first and its hidden fields are merged in,
  #      so CSRF and authenticity tokens are handled without configuration.
  #      Set `csrf: false` for a form that has none, or `content_type: json`
  #      for a JSON API (data is then serialised and not CSRF-patched).
  #
  #   3. Bearer token:
  #        user_c:
  #          bearer_token: "eyJhbGci..."
  #          verify_url: "https://target/api/me"
  #
  #   4. HTTP Basic:
  #        user_d:
  #          basic_auth: {user: "api-user", password: "..."}
  #          verify_url: "https://target/api/me"
  #
  # `success_marker` sits on the identity, not inside `login`, and matters more
  # than it looks: a failed login usually returns HTTP 200 with the login form
  # again, so without a marker the harness cannot tell a real session from a
  # bounce and will report confident nonsense.
  identities: {}
  #   user_a:
  #     cookies: {session: "..."}
  #     verify_url: "https://target/dashboard"
  #     success_marker: "Sign out"
  #   user_b:
  #     cookies: {session: "..."}
  #     verify_url: "https://target/dashboard"
  #     success_marker: "Sign out"

llm:
  model: ""            # e.g. "deepseek" (deepseek/deepseek-chat), "openai", or a full "provider/model"
  api_key: ""
  temperature: 0.1
  max_tokens: 2000

rate_limits:
  default:
    concurrent: 5
    per_minute: 60
  dns:
    concurrent: 10
    per_minute: 120
  http:
    concurrent: 5
    per_minute: 60
  scan:
    concurrent: 1
    per_minute: 10

detectability:
  default: "high"  # low | medium | high

# Per-engagement resource caps for the pentest-agent pipeline. Set any value
# to 0 to disable that cap.
budget_limits:
  max_requests: 0              # 0 = unlimited
  max_wall_clock_seconds: 0    # 0 = unlimited
  max_llm_calls: 0             # 0 = unlimited
  max_concurrent_actions: 5    # throughput knob, not a cap

# Response codes recorded as WAF/honeypot signals on the state store. Purely
# observational — nothing is blocked or skipped based on these.
waf:
  block_codes: [503, 429]
  honeypot_codes: [500]

modules:
  auto_run: true
  max_consecutive_empty: 5  # stop module after N empty probes
  record_http_evidence: true
  idor:
    # Explicit object endpoints for the idor_differ module. Normally derived
    # from js_analysis output; list them here when the API shape is already
    # known, otherwise the module falls back to its built-in path seeds.
    endpoints: []
    # Ceiling on cross-account probes per endpoint template.
    max_probes_per_template: 15

    # Ceiling on collection endpoints fetched while mapping who owns what.
    max_collections: 60

    # Collection endpoints to enumerate directly. When neither `endpoints` nor
    # a discovered object URL exists, the module synthesises object templates
    # from these — that is the case where recon only ever found a list route.
    collection_paths: []
    #   - "/api/v1/invoices"

    # Probe a built-in resource wordlist for collection endpoints. This is
    # what finds objects the crawler never saw. Costs one request per
    # (prefix x resource), so lower `max_collections` if the target is slow.
    probe_collections: true
    # Resources to try when the wordlist above is not enough. Defaults to a
    # built-in list of per-user resources.
    resources: []
    # api_prefixes: ["/api", "/api/v1", "/v1"]

    # Page that identifies the *requesting* account, used to attribute a leak
    # to a third party. Defaults to each identity's own verify_url.
    account_endpoint: ""

    # Objects readable with no session at all. Off by default because it
    # widens the test surface beyond the accounts you supplied.
    test_anonymous: false

    # Cross-account write authorisation. Reading another account's invoice is
    # bad; overwriting it is worse, and many apps check GET but not the
    # mutating verbs. PATCH/PUT echo the record's current values back, so a
    # confirmed bug still leaves the data intact.
    test_write_methods: []
    #   - PATCH
    #   - PUT
    # DELETE cannot be made safe and is never sent without this flag.
    allow_destructive: false

    # Sequential identifier probing for records belonging to accounts you do
    # not control — the case two test accounts can never prove. Reaches other
    # people's data, so it is opt-in and bounded.
    id_probing:
      enabled: false
      radius: 3    # how far from each known reference to try
      max: 20      # hard ceiling on requests

  mass_assignment:
    # Writes to the configured account, so it is off unless you turn it on.
    # It only ever writes to the caller's own object, never anyone else's.
    enabled: false

    # Where to look for the caller's own record. Left empty it tries the
    # usual /api/me, /api/profile, ... shapes. Set it when recon already found
    # the object URL — that URL is also used as the write target.
    endpoints: []
    #   - "https://api.example.com/users/me"

    # Optional: a different URL for the update, e.g. when the read endpoint is
    # read-only. Accepts a full URL or a path.
    # write_endpoint: "https://api.example.com/users/me"

    method: PATCH      # PATCH, PUT or POST

    # Fields to try. Defaults to a list of privilege-bearing names (role,
    # is_admin, credits, ...). Anything the account can already see is skipped.
    fields: []
    #   - "role"
    #   - "is_admin"

    # Value sent for each field, and the value written back afterwards. An API
    # that binds arbitrary fields is almost always doing a partial update, so
    # the reset has to name the field — omitting it would leave the probe in.
    probe_type: bool   # bool | int | string

  prototype_pollution:
    # Sends a canary property through a JSON body and checks whether it turned
    # up on Object.prototype. Left on: a handful of POSTs, no data harmed, and
    # the canary is inert and unique per run. The pollution itself does persist
    # until the process restarts.
    enabled: true

    # Endpoints that accept a JSON body. Set these from recon when you know
    # them; otherwise the usual profile/account/update shapes are tried.
    endpoints: []
    #   - "https://api.example.com/api/profile"

    # Where to look for proof. It must return a freshly built object, and it
    # must list inherited properties — an endpoint that returns a bare {}
    # proves nothing, because JSON.stringify only walks own properties and
    # would hide a polluted prototype. Point this at a Node/Express app you
    # control while testing. Defaults to the first endpoint above.
    # reflect_endpoint: "https://api.example.com/api/reflect"

    methods: [POST, PUT]

    # The two shapes that reach a prototype. Trim to one if you want the
    # smallest possible footprint.
    payloads:
      - "__proto__"
      - "constructor.prototype"

  open_redirect:
    enabled: true

    # Parameter names to try. Left empty, the common redirect names plus any
    # redirect-like name recon already recorded.
    params: []
    #   - "next"
    #   - "returnUrl"

    # Endpoints to test. Left empty, URLs from recon are used, then a short
    # list of shapes that usually redirect (sign-in flows included).
    endpoints: []

    # (endpoint, parameter) pairs to try. Each pair may send several payload
    # shapes, so this is the real bound on request volume.
    max_targets: 40

  cors_audit:
    enabled: true

    # Endpoints to send the probe Origin at. Left empty, the endpoints
    # recon already recorded are used, then a short list of common shapes.
    endpoints: []
    max_endpoints: 20

  sqli_scan:
    # Hand sqlmap an interactsh server so blind injections get proof instead of
    # a "the response looked the same either way" FIRM. Requires the top-level
    # `oob.server_url` above — a callback domain alone is not enough, because
    # sqlmap needs somewhere to poll. Findings are only promoted to CONFIRMED
    # for the exact URL that produced a callback.
    oast: true

misconfig:
  concurrency: 12
  timeout: 5
  max_paths: 160
  max_consecutive_empty: 60
  progress_every: 25

fast_scan:
  # Lightweight replacement for heavyweight consolidated scanners.
  # Focuses on high-signal headers, CORS, and sensitive path exposure.
  timeout: 4
  concurrency: 8
  max_paths: 20
  paths:
    - "/.env"
    - "/.git/config"
    - "/.git/HEAD"
    - "/wp-config.php"
    - "/wp-content/debug.log"
    - "/phpinfo.php"
    - "/info.php"
    - "/server-status"
    - "/actuator/env"
    - "/actuator/heapdump"
    - "/swagger.json"
    - "/swagger/v1/swagger.json"
    - "/v2/api-docs"
    - "/v3/api-docs"
    - "/graphql"
    - "/graphiql"
    - "/api/graphql"
    - "/phpmyadmin/"
    - "/adminer.php"
    - "/backup.sql"

nuclei:
  full_cve_on_confirmed_apex: true

oob:
  # Configure real callback infrastructure for blind SSRF/XXE/SQLi/RCE checks.
  # callback_domain example: "oob.your-bounty-box.example"
  # server_url/poll_url can point at an interactsh-compatible HTTP wrapper.
  callback_domain: ""
  server_url: ""
  poll_url: ""
  token: ""
  poll_interval: 2
  poll_timeout: 30
  # `enabled: false` turns off OOB everywhere without deleting the settings.
  # enabled: true

xss:
  max_points: 80
  browser_confirm: true
  dalfox_timeout: 600

scoring:
