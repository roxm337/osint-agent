    - "auth[_-]?token[\\s\"'`]?[:=][\\s\"'`]?[\\w-]{16,64}"
    # AWS
    - "AKIA[0-9A-Z]{16}"
    - "aws[_-]?secret[_-]?access[_-]?key[\\s\"'`]?[:=][\\s\"'`]?[\\w/+]{40}"
    # GitHub
    - "ghp_[a-zA-Z0-9]{36}"
    - "ghs_[a-zA-Z0-9]{36}"
    - "github[_-]?token[\\s\"'`]?[:=][\\s\"'`]?[a-zA-Z0-9_]{40}"
    # Google
    - "AIza[0-9A-Za-z-_]{35}"
    # Anthropic
    - "sk-ant-[a-zA-Z0-9_-]{48,}"
    # OpenAI
    - "sk-[a-zA-Z0-9]{48}"
    - "sk-proj-[a-zA-Z0-9-_]{48,}"
    # Stripe
    - "sk_live_[0-9a-zA-Z]{24}"
    - "rk_live_[0-9a-zA-Z]{24}"
    # Twilio
    - "SK[0-9a-fA-F]{32}"
    # Slack
    - "xox[abp]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-f0-9]{32}"
    - "xoxr-[0-9]{12}-[a-zA-Z0-9]{24}"
    # JWT
    - "eyJ[a-zA-Z0-9_-]+\\.[a-zA-Z0-9_-]+\\.[a-zA-Z0-9_-]+"
    # Private keys
    - "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
    # Passwords in config
    - "password[\\s\"'`]?[:=][\\s\"'`]?[^\\s\"'`]{8,}"
    - "passwd[\\s\"'`]?[:=][\\s\"'`]?[^\\s\"'`]{8,}"
